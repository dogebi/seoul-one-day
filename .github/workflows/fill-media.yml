name: fill-media
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download media-v1 --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir assets --clobber
          ls -l assets/*.mp4
      - name: Commit MP4s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/*.mp4
          git diff --cached --quiet || git commit -m "media: add cover/closing MP4 from release assets"
          git push
